<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <link rel="stylesheet" href="Product.css" />
  <style>
    /* Remove box-shadow on select button */
    .form-select:focus {
      box-shadow: none !important;
    }
    body {
      background-color: ;
    }
    .wrapper2 {
      justify-content: center;
    }
  </style>
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: "Exo 2", sans-serif;
    }
    .noto-sans-heading {
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-style: normal;
      font-variation-settings: "wdth" 100;
    }
  </style>
  <body>
    <div class="wrapper">
      <div id="search-container">
        <input
          type="text"
          id="search-input"
          placeholder="Search for product here......."
        />
        <button id="search">Search</button>
      </div>

      <div id="buttons">
        <button class="button-value" onclick="filterProducts('all')">
          All
        </button>
        <button class="button-value" onclick="filterProducts('Toothpaste')">
          Toothpaste
        </button>
        <button class="button-value" onclick="filterProducts('Brushes')">
          Brushes
        </button>
        <button class="button-value" onclick="filterProducts('Kids')">
          Kids
        </button>
        <button class="button-value" onclick="filterProducts('Accessories')">
          Accessories
        </button>
      </div>
      <div id="products"></div>
    </div>

    <!-- Review -->
    <div class="container">
      <div class="row justify-content-center">
        <div class="wrapper2 mt-5 Ju col-md-6">
          <h3>Enter Review for our Products</h3>
          <form action="#">
            <div class="row g-2">
              <div class="col-md">
                <div class="form-floating">
                  <select class="form-select" id="floatingSelectGrid">
                    <option selected>For</option>
                    <option value="1">Toothpaste</option>
                    <option value="2">Brushes</option>
                    <option value="3">Kids</option>
                    <option value="4">Accessories</option>
                  </select>
                  <label for="floatingSelectGrid">Works with selects</label>
                </div>
              </div>
            </div>
            <div class="rating mt-4">
              <input type="number" name="rating" hidden />
              <i class="bx bx-star star" style="--i: 0"></i>
              <i class="bx bx-star star" style="--i: 1"></i>
              <i class="bx bx-star star" style="--i: 2"></i>
              <i class="bx bx-star star" style="--i: 3"></i>
              <i class="bx bx-star star" style="--i: 4"></i>
            </div>
            <textarea
              name="opinion"
              cols="30"
              rows="5"
              placeholder="Your opinion..."
            ></textarea>
            <div class="btn-group">
              <button type="submit" class="btn submit" onclick="sent()">
                Submit
              </button>
              <button class="btn cancel">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="script.Js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
