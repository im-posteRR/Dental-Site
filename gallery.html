<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GALLERY</title>
    <style>
      html,
      body {
        /* width: 100%;
        overscroll-behavior: none;
        min-height: 100%; */
      }
      body::-webkit-scrollbar {
        display: none;
      }
      .heading {
        font-size: 14rem;
        font-family: "Bebas Neue";
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        margin: 0;
        color: red;
      }
      .Gallerysection {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        height: 100vh;
        margin: 0 auto;
      }
      .gallery {
        height: 200vh;
      }

      .Galleryimg {
        width: 100%;
        height: 700px;
        position: relative;
        background-size: cover;
        z-index: -1;

        &:nth-of-type(1) {
          background-image: url("./assets/Gallery1.jpg");
        }
        &:nth-of-type(2) {
          background-image: url("./assets/dental1.jpg");
        }
        &:nth-of-type(3) {
          background-image: url("./assets/gallery3.jpg");
        }
        &:nth-of-type(4) {
          background-image: url("./assets/gallery4.jpg");
        }
        &:nth-of-type(5) {
          background-image: url("./assets/gallery5.jpg");
        }
        &:nth-of-type(6) {
          background-image: url("./assets/gallery6.jpg");
        }
        &:nth-of-type(7) {
          background-image: url("./assets/gallery7.jpg");
        }
        &:nth-of-type(8) {
          background-image: url("./assets/gallery8.jpg");
        }
        &:nth-of-type(9) {
          background-image: url("./assets/gallery9.jpg");

          &:before {
            content: "";
            position: absolute;
            height: 100vh;
            width: 100%;
            z-index: 4;
            top: 0;
            left: 0;
            border-right: 1px solid black;
          }
        }
      }
      .line {
        border-right: 1px solid black;
      }
    </style>
  </head>
  <body>
    <!-- <h1 class="heading">GALLERY</h1> -->

    <section class="Gallerysection">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </section>

    <section class="Gallerysection">
      <div class="Galleryimg"></div>
      <div class="Galleryimg"></div>
      <div class="Galleryimg"></div>
      <div class="Galleryimg"></div>
      <div class="Galleryimg"></div>
      <div class="Galleryimg"></div>
      <div class="Galleryimg"></div>
      <div class="Galleryimg"></div>
      <div class="Galleryimg"></div>
    </section>

    <section class="Gallerysection"></section>
  </body>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }

    requestAnimationFrame(raf);

    const tl = gsap
      .timeline({
        scrollTrigger: {
          trigger: ".Galleryimg",
          scrub: true,
        },
      })
      .to(".Galleryimg", {
        stagger: 0.2,
        y: -700,
        scrub: true,
      });
  </script>
</html>
